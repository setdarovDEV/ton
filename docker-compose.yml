# One command: `docker compose up --build` → http://localhost:3000
# Services: postgres (state), api (REST/WS, reads DB), indexer (chain → DB), web (React SPA + nginx proxy to api).
name: tonnet

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tonnet
      POSTGRES_PASSWORD: tonnet
      POSTGRES_DB: tonnet
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tonnet -d tonnet"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://tonnet:tonnet@postgres:5432/tonnet?sslmode=disable}
      HTTP_ADDR: ":8080"
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  indexer:
    build:
      context: .
      dockerfile: Dockerfile.indexer
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://tonnet:tonnet@postgres:5432/tonnet?sslmode=disable}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        # Empty = same-origin: nginx inside the web image proxies /api and /ws to the api service.
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_TON_NETWORK: ${VITE_TON_NETWORK:-testnet}
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
