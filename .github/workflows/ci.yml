name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go · lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - name: Test (race)
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: Coverage gate (domain + indexer ≥ 70%)
        run: |
          go test -coverprofile=core.out ./internal/domain/... ./internal/indexer/...
          total=$(go tool cover -func=core.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          echo "domain+indexer coverage: ${total}%"
          awk -v t="$total" 'BEGIN { if (t+0 < 70) { print "coverage below 70%"; exit 1 } }'
      - uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage.out

  web:
    name: Web · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  contracts:
    name: Contracts · compile + sandbox tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
      - run: npx blueprint build --all
      - run: npm test

  docker:
    name: Docker · compose build
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: cp .env.example .env
      - run: docker compose build
